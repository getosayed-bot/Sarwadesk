# SarwaDesk price updater — migrated to Supabase
name: Update Stock Prices
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Fetch prices and update
        env:
          TIINGO_KEY: ${{ secrets.TIINGO_KEY }}
          METALS_KEY: ${{ secrets.METALS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node .github/scripts/update-prices.js
